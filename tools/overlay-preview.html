<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Subtitle overlay preview</title>
    <link rel="stylesheet" href="../server/css/video.css" />
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #111;
      }
      #video-screen .content {
        position: absolute;
        inset: 0;
        background: linear-gradient(135deg, #2b4a6f, #6f4a2b);
      }
      #controls {
        position: fixed;
        top: 8px;
        left: 8px;
        z-index: 10;
        color: #fff;
        font: 14px sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="video-screen">
      <div class="content">
        <video id="videoplayer"></video>
        <div id="subtitle-overlay"></div>
      </div>
    </div>
    <div id="controls">
      t=<input id="time" type="range" min="0" max="6" step="0.05" value="3.2" />
      <span id="label"></span>
      mode=<select id="mode">
        <option value="full">full</option>
        <option value="signs">signs</option>
        <option value="cc">cc</option>
      </select>
    </div>
    <script src="../server/js/core/subtitles.js"></script>
    <script>
      var query = new URLSearchParams(location.search);
      var timeInput = document.getElementById("time");
      var modeInput = document.getElementById("mode");
      timeInput.value = query.get("t") || timeInput.value;
      modeInput.value = query.get("mode") || "full";
      var captions = subtitleOverlay.parse(
        "WEBVTT\n\n1\n00:00:01.000 --> 00:00:05.000\n<i>Where are we headed?</i>"
      );
      fetch(query.get("src") || "fixtures/sample.ass")
        .then(function (response) {
          return response.text();
        })
        .then(function (body) {
          var sources = { original: subtitleOverlay.parse(body), captions: captions };
          var draw = function () {
            subtitleOverlay.events = subtitleOverlay.buildEvents(modeInput.value, sources);
            subtitleOverlay.activeKey = "";
            document.getElementById("label").textContent = timeInput.value + "s";
            subtitleOverlay.render(Number(timeInput.value));
          };
          timeInput.oninput = draw;
          modeInput.onchange = draw;
          window.onresize = function () {
            subtitleOverlay.layoutKey = "";
            draw();
          };
          draw();
        });
    </script>
  </body>
</html>
